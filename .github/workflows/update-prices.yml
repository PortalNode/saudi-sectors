name: Update market prices

on:
  schedule:
    # Times are UTC; Riyadh = UTC + 3. GitHub schedules are best-effort: in
    # November 2026 only 2–3 of ~50 daily slots actually fired, mostly hours
    # late, and none at all on some trading days. Many independent slots, plus
    # the self-chain below, make a missed day far less likely.
    # In session (10:03–15:53 Riyadh), two staggered offsets.
    - cron: '3,18,33,48 7-12 * * 0-4'
    - cron: '8,23,38,53 7-12 * * 0-4'
    # Official closing report, then hourly catch-up until 02:38 Riyadh.
    - cron: '8 13,14,15,17 * * 0-4'
    - cron: '38 12-23 * * 0-4'
    # Next-morning catch-up (03:23–09:23 Riyadh) for a session whose evening
    # runs were all dropped; Mon–Fri UTC covers the Sun–Thu sessions.
    - cron: '23 0-6 * * 1-5'
  workflow_dispatch:
    inputs:
      sleepMinutes:
        description: 'Minutes to wait before fetching (self-chained runs)'
        default: '0'

permissions:
  contents: write
  actions: write
  pages: write
  id-token: write

jobs:
  # A chained run waits here, outside any concurrency group, so its wait never
  # blocks a website deploy and a deploy never cancels the pending update.
  wait:
    runs-on: ubuntu-latest
    timeout-minutes: 135
    steps:
      - name: Wait for the next slot (self-chained run)
        run: |
          MINUTES="${{ github.event.inputs.sleepMinutes || '0' }}"
          if [ "$MINUTES" != "0" ]; then
            echo "Chained run: sleeping $MINUTES minutes until the next slot."
            sleep $(( MINUTES * 60 ))
          fi

  update:
    needs: wait
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Updates run one at a time; an update is never cancelled midway.
    concurrency:
      group: price-update
      cancel-in-progress: false
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      # saudiexchange.sa sits behind Akamai, which rejects non-browser TLS
      # fingerprints with 403. curl-impersonate speaks Chrome's fingerprint so
      # the official daily report and market page stay reachable; the update
      # script falls back to plain fetch when this binary is unavailable.
      - name: Install curl-impersonate
        run: |
          curl -sSL -o /tmp/ci.tgz https://github.com/lwthiker/curl-impersonate/releases/download/v0.6.1/curl-impersonate-v0.6.1.x86_64-linux-gnu.tar.gz
          sudo mkdir -p /opt/curl-impersonate
          sudo tar xzf /tmp/ci.tgz -C /opt/curl-impersonate
          /opt/curl-impersonate/curl_chrome116 --version
          # Diagnostic: does the Chrome fingerprint pass Akamai right now?
          /opt/curl-impersonate/curl_chrome116 -sS -o /dev/null -w 'report HTTP %{http_code}\n' \
            https://www.saudiexchange.sa/Resources/Reports-v2/DetailedDaily_en.html || true
      - name: Test price integrity and existing UI
        run: node --test scripts/*.test.mjs tests/*.test.mjs
      - name: Fetch dated official closes or explicitly delayed quotes
        run: node scripts/update-prices.mjs
        env:
          CURL_IMPERSONATE_BIN: /opt/curl-impersonate/curl_chrome116
      # A push made meanwhile (site edits) used to reject the bot's push and
      # lose the update. Rebase onto it; if that conflicts, start again from
      # the newest main and refetch, so prices land on the latest content.
      - name: Commit refreshed data
        id: commit
        env:
          CURL_IMPERSONATE_BIN: /opt/curl-impersonate/curl_chrome116
        run: |
          git config user.name "price-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git add dist/data.json
            if git diff --cached --quiet; then
              echo "No price changes to commit."
              echo "changed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git commit -m "Update dated market snapshot $(date -u +%F)"
            if git push; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push rejected (attempt $attempt); main moved meanwhile."
            git fetch origin main
            if git rebase origin/main && git push; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            git reset --hard origin/main
            node scripts/update-prices.mjs
          done
          echo "Could not publish the refreshed data after 3 attempts."
          exit 1
      - name: Upload website files
        if: steps.commit.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: update
    if: needs.update.outputs.changed == 'true'
    runs-on: ubuntu-latest
    # Shares the Pages lock with the site deploy workflow.
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  # GitHub silently drops scheduled runs under load; a chain that re-triggers
  # the next slot makes one start enough for the rest of the day.
  chain:
    needs: [update, deploy]
    if: ${{ always() && needs.update.result != 'cancelled' }}
    runs-on: ubuntu-latest
    steps:
      - name: Chain the next update slot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Another chained run already queued or waiting: do not fork a second
          # chain (every cron start would otherwise add one). Updates are
          # serialized, so that run reaches this step later and chains on.
          WAITING=$(gh run list --repo "${{ github.repository }}" --workflow update-prices.yml \
            --event workflow_dispatch --limit 20 --json databaseId,status \
            -q '[.[] | select(.databaseId != ${{ github.run_id }} and (.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "pending" or .status == "requested"))] | length')
          if [ "${WAITING:-0}" != "0" ]; then
            echo "Another chained run is already pending; the chain continues there."
            exit 0
          fi
          MINUTES=$(node -e '
            const parts = new Intl.DateTimeFormat("en-GB",{timeZone:"Asia/Riyadh",weekday:"short",hour:"2-digit",minute:"2-digit",hourCycle:"h23"}).formatToParts(new Date());
            const get = k => parts.find(p=>p.type===k)?.value;
            const now = Number(get("hour"))*60+Number(get("minute"));
            const weekday = !["Fri","Sat"].includes(get("weekday"));
            const slots = [];
            if (weekday) {
              for (let m = 603; m <= 948; m += 15) slots.push(m); // 10:03–15:48
              slots.push(968, 1028, 1088, 1208);                  // 16:08, 17:08, 18:08, 20:08
            }
            const next = slots.find(m => m > now + 2);
            console.log(next == null ? 0 : next - now);
          ')
          # Up to 125 minutes bridges 16:08 → 17:08 → 18:08 → 20:08.
          if [ "$MINUTES" = "0" ] || [ "$MINUTES" -gt 125 ]; then
            echo "No next slot within reach today; chain ends."
          else
            gh workflow run update-prices.yml --repo "${{ github.repository }}" -f sleepMinutes=$MINUTES
            echo "Chained the next slot in $MINUTES minutes."
          fi
