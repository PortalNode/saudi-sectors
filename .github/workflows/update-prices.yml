name: Update market prices

on:
  schedule:
    # Dated delayed prices during the session, including closing auction.
    # UTC + 3 = Riyadh. Actions schedules are best-effort, not real-time feeds.
    - cron: '3,18,33,48 7-12 * * 0-4'
    # A second staggered slot: GitHub drops or delays scheduled runs under
    # load, and two independent offsets make a total miss far less likely.
    - cron: '8,23,38,53 7-12 * * 0-4'
    # Retry the official closing report at 16:08, 17:08, 18:08 and 20:08 Riyadh.
    - cron: '8 13,14,15,17 * * 0-4'
  workflow_dispatch:
    inputs:
      sleepMinutes:
        description: 'Minutes to wait before fetching (self-chained runs)'
        default: '0'

permissions:
  contents: write
  actions: write
  pages: write
  id-token: write

# Both workflows share the publication lock. An update is never cancelled midway.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Wait for the next slot (self-chained run)
        run: |
          MINUTES="${{ github.event.inputs.sleepMinutes || '0' }}"
          if [ "$MINUTES" != "0" ]; then
            echo "Chained run: sleeping $MINUTES minutes until the next slot."
            sleep $(( MINUTES * 60 ))
          fi
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      # saudiexchange.sa sits behind Akamai, which rejects non-browser TLS
      # fingerprints with 403. curl-impersonate speaks Chrome's fingerprint so
      # the official daily report and market page stay reachable; the update
      # script falls back to plain fetch when this binary is unavailable.
      - name: Install curl-impersonate
        run: |
          curl -sSL -o /tmp/ci.tgz https://github.com/lwthiker/curl-impersonate/releases/download/v0.6.1/curl-impersonate-v0.6.1.x86_64-linux-gnu.tar.gz
          sudo mkdir -p /opt/curl-impersonate
          sudo tar xzf /tmp/ci.tgz -C /opt/curl-impersonate
          /opt/curl-impersonate/curl_chrome116 --version
          # Diagnostic: does the Chrome fingerprint pass Akamai right now?
          /opt/curl-impersonate/curl_chrome116 -sS -o /dev/null -w 'report HTTP %{http_code}\n' \
            https://www.saudiexchange.sa/Resources/Reports-v2/DetailedDaily_en.html || true
      - name: Test price integrity and existing UI
        run: node --test scripts/*.test.mjs tests/*.test.mjs
      - name: Fetch dated official closes or explicitly delayed quotes
        run: node scripts/update-prices.mjs
        env:
          CURL_IMPERSONATE_BIN: /opt/curl-impersonate/curl_chrome116
      - name: Commit refreshed data
        run: |
          git config user.name "price-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/data.json
          if git diff --cached --quiet; then
            echo "No price changes to commit."
          else
            git commit -m "Update dated market snapshot $(date -u +%F)"
            git push
          fi
      - name: Upload website files
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      # GitHub silently drops scheduled runs under load; a chain that re-triggers
      # the next slot makes one morning start enough for the whole session.
      - name: Chain the next update slot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MINUTES=$(node -e '
            const parts = new Intl.DateTimeFormat("en-GB",{timeZone:"Asia/Riyadh",weekday:"short",hour:"2-digit",minute:"2-digit",hourCycle:"h23"}).formatToParts(new Date());
            const get = k => parts.find(p=>p.type===k)?.value;
            const now = Number(get("hour"))*60+Number(get("minute"));
            const weekday = !["Fri","Sat"].includes(get("weekday"));
            const slots = [];
            if (weekday) {
              for (let m = 603; m <= 948; m += 15) slots.push(m); // 10:03–15:48
              slots.push(968, 1028, 1088, 1208);                  // 16:08, 17:08, 18:08, 20:08
            }
            const next = slots.find(m => m > now + 2);
            console.log(next == null ? 0 : next - now);
          ')
          if [ "$MINUTES" = "0" ] || [ "$MINUTES" -gt 22 ]; then
            echo "No next slot within reach today; chain ends."
          else
            gh workflow run update-prices.yml --repo "${{ github.repository }}" -f sleepMinutes=$MINUTES
            echo "Chained the next slot in $MINUTES minutes."
          fi
