name: Update closing prices

on:
  schedule:
    # 12:30 UTC = 15:30 Riyadh, Sunday–Thursday (Tadawul closes at 15:00)
    - cron: '30 12 * * 0-4'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch closing prices
        run: node scripts/update-prices.mjs
      - name: Commit refreshed data
        run: |
          git config user.name "price-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/data.json
          if git diff --cached --quiet; then
            echo "No price changes to commit."
          else
            git commit -m "Update closing prices $(date -u +%F)"
            git push
          fi
      - name: Upload website files
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
