name: Rebuild stock chart candles

# Rebuilds five years of daily candles per stock on TradingView's basis from the Saudi Exchange's
# adjusted closes (scripts/backfill-ohlc.mjs). Run it by hand after a change to the method, and
# weekly as a safety net for capital actions the daily update could not detect.
on:
  workflow_dispatch:
    inputs:
      symbols:
        description: 'Comma-separated symbols (empty = every stock)'
        default: ''
  schedule:
    # Friday 06:17 UTC (09:17 Riyadh): no session, so it never races the price updates.
    - cron: '17 6 * * 5'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Shares the price-update lock: candles are never written by two jobs at once.
    concurrency:
      group: price-update
      cancel-in-progress: false
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      # saudiexchange.sa sits behind Akamai, which rejects non-browser TLS fingerprints with 403.
      - name: Install curl-impersonate
        run: |
          curl -sSL -o /tmp/ci.tgz https://github.com/lwthiker/curl-impersonate/releases/download/v0.6.1/curl-impersonate-v0.6.1.x86_64-linux-gnu.tar.gz
          sudo mkdir -p /opt/curl-impersonate
          sudo tar xzf /tmp/ci.tgz -C /opt/curl-impersonate
          /opt/curl-impersonate/curl_chrome116 --version
      - name: Test candles and existing UI
        run: node --test scripts/*.test.mjs tests/*.test.mjs
      - name: Rebuild candles from the exchange's adjusted closes
        env:
          CURL_IMPERSONATE_BIN: /opt/curl-impersonate/curl_chrome116
          SYMBOLS: ${{ github.event.inputs.symbols }}
        run: |
          if [ -n "$SYMBOLS" ]; then node scripts/backfill-ohlc.mjs --symbols "$SYMBOLS"; else node scripts/backfill-ohlc.mjs; fi
      - name: Compare with TradingView's own figures (report only)
        run: node scripts/compare-ohlc-tradingview.mjs || true
      - name: Test rebuilt candles
        run: node --test scripts/*.test.mjs tests/*.test.mjs
      - name: Commit rebuilt candles
        id: commit
        run: |
          git config user.name "price-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A dist/ohlc
          if git diff --cached --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git commit -m "Rebuild stock chart candles on TradingView's basis $(date -u +%F)"
          for attempt in 1 2 3; do
            if git push; then echo "changed=true" >> "$GITHUB_OUTPUT"; exit 0; fi
            git fetch origin main && git rebase origin/main || { git rebase --abort; exit 1; }
          done
          exit 1
      - name: Upload website files
        if: steps.commit.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: rebuild
    if: needs.rebuild.outputs.changed == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
